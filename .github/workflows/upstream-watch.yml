name: Check upstream PDFCraft updates

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check original repository without merging or deploying
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/storytold/pdfcraft.git
          git fetch --no-tags upstream main
          fork_sha="$(git rev-parse origin/main)"
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          incoming="$(git rev-list --count "$fork_sha..$upstream_sha")"
          echo "Fork main: $fork_sha"
          echo "Upstream main: $upstream_sha"
          echo "New upstream commits: $incoming"
          if [ "$incoming" -eq 0 ]; then
            echo "No upstream changes to review."
            exit 0
          fi
          title="Upstream PDFCraft updates available"
          body="$(printf 'The original PDFCraft repository has %s commit(s) not yet present in this fork.\n\nOriginal: https://github.com/storytold/pdfcraft\nFork: https://github.com/%s\nUpstream commit: %s\n\nReview and integrate on a separate branch. Check licensing, branding and Dutch translations, then run build/tests before publishing. No code was merged or deployed by this check.\n' "$incoming" "$REPO" "$upstream_sha")"
          existing="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body "$body"
            echo "Updated issue #$existing"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
            echo "Created update review issue"
          fi
