name: Check upstream PDFCraft updates

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check original repository without changing this fork
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          upstream="storytold/pdfcraft"
          upstream_sha="$(gh api "repos/$upstream/commits/main" --jq '.sha')"
          fork_sha="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
          compare="$(gh api "repos/$REPO/compare/main...$upstream:main")"
          ahead="$(jq -r '.ahead_by' <<< "$compare")"
          behind="$(jq -r '.behind_by' <<< "$compare")"
          echo "Fork main: $fork_sha"
          echo "Upstream main: $upstream_sha"
          echo "Ahead by: $ahead; behind by: $behind"
          if [ "$ahead" -eq 0 ]; then
            echo "No upstream changes to review."
            exit 0
          fi
          title="Upstream PDFCraft updates available"
          body="$(printf 'The original repository has %s commit(s) not yet in this fork.\n\nUpstream: https://github.com/storytold/pdfcraft\nCompare: https://github.com/%s/compare/main...storytold:main\n\nReview changes, merge carefully into a separate branch, run the web build and test branding/localization before publishing. Nothing has been merged or deployed automatically.\n' "$ahead" "$REPO")"
          existing="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body "$body"
            echo "Updated issue #$existing"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
            echo "Created update review issue"
          fi
