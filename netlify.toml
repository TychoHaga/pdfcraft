# Build the Rust/WebAssembly app when Netlify deploys directly from GitHub.
# Netlify builds consume build minutes; GitHub Actions artifacts remain an alternative.
[build]
  command = "rustup target add wasm32-unknown-unknown && cargo install trunk --locked && cd apps/pdfcraft-web && trunk build --release"
  publish = "dist/web"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
